[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fior"
version = "0.1.0"
description = "FIOR - Federated Inference Over Relays"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "noble-secp256k1>=1.0",
    "requests>=2.28",
    "websockets>=11.0",
    "typer>=0.9",
    "rich>=13.0",
    "tomli>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
fior = "fior.cli.main:app"

[tool.setuptools.packages.find]
include = ["fior*"]
